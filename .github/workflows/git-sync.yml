name: Sync Development

on:
  schedule:
    # Daily at 22:30 IST ≈ 17:00 UTC (adjust to your preferred time)
    - cron: '0 17 * * *'
  workflow_dispatch: # ✅ Manual trigger button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # step 1: checkout (default branch)
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0  # non-shallow for clean merges

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/torvalds/linux.git || true
          git fetch upstream

      # step 2: Update upstream-sync
      - name: merge master
        run: |
          git checkout upstream-sync
          git merge --ff-only upstream/master
          git push origin upstream-sync
          echo "✅ upstream-sync is now aligned with master"

      # step 3: Update development
      - name: merge development
        run: |
          git checkout development
          git merge --no-edit upstream-sync
          git push origin development
          echo "✅ development successfully updated"
