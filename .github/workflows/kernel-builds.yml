name: Linux Kernel CI

on:
  schedule:
    # Daily at 23:00 IST ≈ 17:30 UTC (adjust to your preferred time)
    - cron: '30 17 * * *'
  workflow_dispatch: # ✅ Manual trigger button

permissions:
  contents: read

env:
  CI_PROFILE: stable

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            config: defconfig
          - arch: arm64
            config: defconfig
          - arch: riscv
            config: defconfig
          - arch: riscv
            config: randconfig

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development

      - uses: ./.github/actions/kernel-ci-prepare

      - name: Set build env
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "CONFIG=${{ matrix.config }}" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          chmod +x .github/ci/build-kernel.sh
          .github/ci/build-kernel.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}-${{ matrix.config }}-${{ github.run_id }}
          retention-days: 7
          path: out/
