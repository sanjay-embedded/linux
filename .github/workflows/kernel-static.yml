name: Kernel Static Discovery

on:
  schedule:
    # Daily at 23:00 IST ≈ 17:30 UTC (adjust to your preferred time)
    - cron: '30 17 * * 3,6'
  workflow_dispatch: # ✅ Manual trigger button

permissions:
  contents: read

env:
  CI_PROFILE: stable

jobs:
  # -----------------------------------------
  # Documentation
  # -----------------------------------------
  static-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install heavy deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential \
            python3-sphinx \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-latex-extra \
            graphviz

      - name: Set build env
        run: |
          echo "ARCH=x86_64" >> $GITHUB_ENV
          echo "CI_STAGE=doc" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          chmod +x .github/ci/build-mode.sh
          .github/ci/build-mode.sh

  # -----------------------------------------
  # Coccicheck (Heavy)
  # -----------------------------------------
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install heavy deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential \
            coccinelle \
            graphviz

      - name: Set build env
        run: |
          echo "ARCH=x86_64" >> $GITHUB_ENV
          echo "CI_STAGE=cocci" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          chmod +x .github/ci/build-mode.sh
          .github/ci/build-mode.sh

  # -----------------------------------------
  # Clang
  # -----------------------------------------
  static-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            config: defconfig
          - arch: arm64
            config: defconfig
          - arch: riscv
            config: defconfig

    steps:
      - uses: actions/checkout@v4

      - name: Install clang + cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential \
            clang llvm \
            gcc-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu

      - name: Set build env
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "CONFIG=${{ matrix.config }}" >> $GITHUB_ENV
          echo "CI_STAGE=clang" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          chmod +x .github/ci/build-mode.sh
          .github/ci/build-mode.sh

  # -----------------------------------------
  # kselftest
  # -----------------------------------------
  static-kselftest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            config: defconfig
          - arch: arm64
            config: defconfig
          - arch: riscv
            config: defconfig

    steps:
      - uses: actions/checkout@v4

      - name: Install minimal deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu

      - name: Set build env
        run: |
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "CONFIG=${{ matrix.config }}" >> $GITHUB_ENV
          echo "CI_STAGE=kselftest" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          chmod +x .github/ci/build-mode.sh
          .github/ci/build-mode.sh
